name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
        # No live Azure resources touched here: the webhook validator is
        # pure crypto and the GitHub->Asana sync logic runs against mocked
        # IAsanaClient/IIdMappingStore. Nothing to deploy to check against
        # yet — see infra/main.bicep for the environment this ships to.
